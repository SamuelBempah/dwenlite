# Cost-optimised: one tiny machine that sleeps when nobody is using it.
app = 'dwenlite-backend'
primary_region = 'ord'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '3001'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'     # machine sleeps when idle (you pay almost nothing)
  auto_start_machines = true      # and wakes on the next request
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    soft_limit = 20
    hard_limit = 40

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'

