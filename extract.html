<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Text Extractor</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            text-align: center;
        }
        input[type="file"] {
            margin: 20px 0;
        }
        #output {
            border: 1px solid #ccc;
            padding: 10px;
            min-height: 100px;
            text-align: left;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        #error {
            color: red;
            display: none;
        }
    </style>
</head>
<body>
    <h1>File Text Extractor</h1>
    <p>Select a file to extract text from (.txt, .pdf, .docx, .csv, .json, .pptx supported):</p>
    <input type="file" id="fileInput" accept="*/*">
    <div id="output">Extracted text will appear here...</div>
    <div id="error"></div>

    <!-- Load external libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.9.359/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.2/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.7.1/jszip.min.js"></script>

    <script>
        // Configure pdf.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.9.359/pdf.worker.min.js';

        const fileInput = document.getElementById('fileInput');
        const outputDiv = document.getElementById('output');
        const errorDiv = document.getElementById('error');

        fileInput.addEventListener('change', async (event) => {
            const file = event.target.files[0];
            if (!file) return;

            outputDiv.textContent = 'Processing...';
            errorDiv.style.display = 'none';

            try {
                const text = await extractText(file);
                outputDiv.textContent = text || 'No text could be extracted.';
            } catch (error) {
                errorDiv.textContent = `Error: ${error.message}`;
                errorDiv.style.display = 'block';
                outputDiv.textContent = '';
            }
        });

        async function extractText(file) {
            const extension = file.name.split('.').pop().toLowerCase();
            const reader = new FileReader();

            switch (extension) {
                case 'txt':
                    return new Promise((resolve) => {
                        reader.onload = () => resolve(reader.result);
                        reader.readAsText(file);
                    });

                case 'pdf':
                    return new Promise((resolve, reject) => {
                        reader.onload = async () => {
                            try {
                                const typedArray = new Uint8Array(reader.result);
                                const pdf = await pdfjsLib.getDocument(typedArray).promise;
                                let text = '';
                                for (let i = 1; i <= pdf.numPages; i++) {
                                    const page = await pdf.getPage(i);
                                    const content = await page.getTextContent();
                                    text += content.items.map(item => item.str).join(' ') + '\n';
                                }
                                resolve(text);
                            } catch (error) {
                                reject(error);
                            }
                        };
                        reader.readAsArrayBuffer(file);
                    });

                case 'docx':
                    return new Promise((resolve, reject) => {
                        reader.onload = async () => {
                            try {
                                const arrayBuffer = reader.result;
                                const result = await mammoth.extractRawText({ arrayBuffer });
                                resolve(result.value);
                            } catch (error) {
                                reject(error);
                            }
                        };
                        reader.readAsArrayBuffer(file);
                    });

                case 'csv':
                    return new Promise((resolve, reject) => {
                        reader.onload = () => {
                            try {
                                const result = Papa.parse(reader.result, { header: true });
                                if (result.errors.length) {
                                    throw new Error('Failed to parse CSV');
                                }
                                const text = result.data.map(row => 
                                    Object.values(row).join(', ')
                                ).join('\n');
                                resolve(text);
                            } catch (error) {
                                reject(error);
                            }
                        };
                        reader.readAsText(file);
                    });

                case 'json':
                    return new Promise((resolve, reject) => {
                        reader.onload = () => {
                            try {
                                const json = JSON.parse(reader.result);
                                const text = JSON.stringify(json, null, 2);
                                resolve(text);
                            } catch (error) {
                                reject(error);
                            }
                        };
                        reader.readAsText(file);
                    });

                case 'pptx':
                    // Reverted to JSZip for reliable PPTX text extraction
                    // PptxGenJS is primarily for creating PPTX files and has limited support for reading existing files
                    return new Promise((resolve, reject) => {
                        reader.onload = async () => {
                            try {
                                const arrayBuffer = reader.result;
                                const zip = await JSZip.loadAsync(arrayBuffer);
                                let text = '';
                                // Iterate through slide files (e.g., slide1.xml, slide2.xml)
                                const slideFiles = Object.keys(zip.files).filter(file => 
                                    file.match(/ppt\/slides\/slide\d+\.xml/)
                                );
                                for (const slideFile of slideFiles) {
                                    const xmlText = await zip.file(slideFile).async('string');
                                    // Parse XML and extract text from <a:t> tags
                                    const parser = new DOMParser();
                                    const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
                                    const textNodes = xmlDoc.getElementsByTagName('a:t');
                                    for (let i = 0; i < textNodes.length; i++) {
                                        text += textNodes[i].textContent + ' ';
                                    }
                                    text += '\n';
                                }
                                resolve(text.trim());
                            } catch (error) {
                                reject(new Error('Failed to extract text from PPTX: ' + error.message));
                            }
                        };
                        reader.readAsArrayBuffer(file);
                    });

                default:
                    // Attempt to read as plain text for unknown types
                    return new Promise((resolve) => {
                        reader.onload = () => resolve(reader.result);
                        reader.onerror = () => resolve('Unable to read file as text.');
                        reader.readAsText(file);
                    });
            }
        }
    </script>
</body>
</html>
